services:
  - type: web
    name: agriconnect-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    rootDirectory: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ADMIN_MOBILE
        value: "9999999999"
      - key: ADMIN_PASSWORD
        value: "Admin123!"
